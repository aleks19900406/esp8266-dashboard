<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP8266 nadzor</title>
<style>
  body { font-family: sans-serif; text-align: center; margin-top: 60px; }
  .temp { font-size: 64px; margin: 10px; }
  button { font-size: 22px; padding: 14px 28px; margin: 6px; }
  #status { color: #888; }
</style>
</head>
<body>
<h1>ESP8266</h1>
<div class="temp"><span id="temp">--</span> &deg;C</div>
<div class="temp"><span id="dist">--</span> cm</div>
<p>LED: <b id="led">?</b></p>
<button onclick="send('ON')">Vklopi</button>
<button onclick="send('OFF')">Izklopi</button>
<button onclick="send('TOGGLE')">Preklopi</button>
<p id="status">povezovanje...</p>
<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
<script>
  const ID = "esp-e3a9f4685a";
  const c = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");
  c.on("connect", () => {
    document.getElementById("status").textContent = "povezano";
    c.subscribe([ID + "/temperature", ID + "/distance", ID + "/led/state"]);
  });
  c.on("close", () => document.getElementById("status").textContent = "ni povezave");
  c.on("message", (t, m) => {
    if (t.endsWith("/temperature")) document.getElementById("temp").textContent = m.toString();
    if (t.endsWith("/distance")) document.getElementById("dist").textContent = m.toString();
    if (t.endsWith("/led/state")) document.getElementById("led").textContent = m.toString();
  });
  function send(cmd) { c.publish(ID + "/led/set", cmd); }
</script>
</body>
</html>
